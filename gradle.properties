# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
fabric.loom.dropNonIntermediateRootMethods=true

# Mod Properties
mod.version=1.0
mod.id=dont_drop_your_compass
mod.name=Don't Drop Your Compass
mod.description=Recovery Compasses no longer drop when you die!
mod.license=LGPL-3.0-only
mod.group=com.ordana.dont_drop_your_compass

# Fabric Properties
# check these on https://fabricmc.net/develop
deps.asphodel_api=1.1.1
deps.fabric_loader=0.19.5
loomx.loom_version = 1.19-SNAPSHOT
loomx.loom_remap_plugin = org.relativitymc.neo-loom-remap
loomx.loom_unobf_plugin = org.relativitymc.neo-loom

# Publishing
publish.modrinth=xzeX4hke
